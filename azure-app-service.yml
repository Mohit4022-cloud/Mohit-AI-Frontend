version: 1.0

env:
  - name: NODE_VERSION
    value: "20-lts"
  - name: NPM_CONFIG_PRODUCTION
    value: "false"

build:
  - script: |
      echo "Installing dependencies..."
      npm ci --legacy-peer-deps
      echo "Building Next.js app..."
      npm run build
      echo "Cleaning dev dependencies..."
      npm prune --production
      echo "Build complete!"

run:
  - script: npm start